# Cloudflare Worker config for the HMF Design Clinic AI evaluation endpoint.
# Deploy:  wrangler secret put ANTHROPIC_API_KEY   (paste your key)
#          wrangler deploy
# Then put the printed URL in firebase-config.js -> window.AI_EVAL_ENDPOINT.

name = "hmf-ai-eval"
main = "ai-eval-worker.js"
compatibility_date = "2024-11-01"

[vars]
# Exact origin your pages are served from (scheme + host, no trailing slash).
# For GitHub Pages this is your user/org pages origin:
ALLOW_ORIGIN = "https://coolmukky.github.io"

# Secrets are NOT stored here. Set them with wrangler:
#   wrangler secret put ANTHROPIC_API_KEY      (required)
#   wrangler secret put EVAL_SHARED_TOKEN      (optional, light abuse guard)
